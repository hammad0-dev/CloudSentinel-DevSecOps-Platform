apiVersion: v1
kind: Pod
metadata:
  name: no-limits-pod
  namespace: cloudsentinel-p-9001
  labels: {app: no-limits-pod, owner: project-9001}
spec:
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: c
      image: 229032674007.dkr.ecr.ap-south-1.amazonaws.com/cloudsentinel/p-9001-app:v1.0.0-mk
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}

