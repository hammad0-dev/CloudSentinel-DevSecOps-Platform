apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: eks-test-disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow latest tag
    policies.kyverno.io/category: CloudSentinel FE-1
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["cloudsentinel-p-9001"]
      validate:
        message: "An explicit image tag is required."
        pattern:
          spec:
            =(initContainers):
              - image: "*:*"
            containers:
              - image: "*:*"
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["cloudsentinel-p-9001"]
      validate:
        message: "Using the mutable image tag 'latest' is not allowed."
        pattern:
          spec:
            =(initContainers):
              - image: "!*:latest"
            containers:
              - image: "!*:latest"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: eks-test-disallow-privileged
  annotations:
    policies.kyverno.io/title: Disallow privileged containers
    policies.kyverno.io/category: CloudSentinel FE-1/FE-2
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: privileged-containers
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["cloudsentinel-p-9001"]
      validate:
        message: "Privileged containers are not allowed. securityContext.privileged must be unset or false."
        pattern:
          spec:
            =(initContainers):
              - =(securityContext):
                  =(privileged): "false"
            containers:
              - =(securityContext):
                  =(privileged): "false"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: eks-test-require-labels
  annotations:
    policies.kyverno.io/title: Require app and owner labels
    policies.kyverno.io/category: CloudSentinel FE-1
    policies.kyverno.io/severity: low
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-app-owner-labels
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["cloudsentinel-p-9001"]
      validate:
        message: "The labels 'app' and 'owner' are required."
        pattern:
          metadata:
            labels:
              app: "?*"
              owner: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: eks-test-require-resource-limits
  annotations:
    policies.kyverno.io/title: Require CPU and memory limits
    policies.kyverno.io/category: CloudSentinel FE-1
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-resource-limits
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["cloudsentinel-p-9001"]
      validate:
        message: "CPU and memory limits are required for every container."
        pattern:
          spec:
            =(initContainers):
              - resources:
                  limits:
                    cpu: "?*"
                    memory: "?*"
            containers:
              - resources:
                  limits:
                    cpu: "?*"
                    memory: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: eks-test-require-run-as-non-root
  annotations:
    policies.kyverno.io/title: Require runAsNonRoot
    policies.kyverno.io/category: CloudSentinel FE-1/FE-2
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["cloudsentinel-p-9001"]
      validate:
        message: "Running as root is not allowed. Set securityContext.runAsNonRoot to true on the Pod or every container."
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
              =(initContainers):
                - =(securityContext):
                    =(runAsNonRoot): true
              containers:
                - =(securityContext):
                    =(runAsNonRoot): true
          - spec:
              =(initContainers):
                - securityContext:
                    runAsNonRoot: true
              containers:
                - securityContext:
                    runAsNonRoot: true
    - name: run-as-user-not-zero
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["cloudsentinel-p-9001"]
      validate:
        message: "runAsUser 0 (root) is not allowed."
        pattern:
          spec:
            =(securityContext):
              =(runAsUser): ">0"
            =(initContainers):
              - =(securityContext):
                  =(runAsUser): ">0"
            containers:
              - =(securityContext):
                  =(runAsUser): ">0"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: eks-test-disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow privilege escalation
    policies.kyverno.io/category: CloudSentinel Module 10
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: privilege-escalation
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["cloudsentinel-p-9001"]
      validate:
        message: "securityContext.allowPrivilegeEscalation must be false for every container."
        pattern:
          spec:
            =(initContainers):
              - securityContext:
                  allowPrivilegeEscalation: "false"
            containers:
              - securityContext:
                  allowPrivilegeEscalation: "false"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: eks-test-restrict-image-registries
  annotations:
    policies.kyverno.io/title: Trusted registry (project ECR only)
    policies.kyverno.io/category: CloudSentinel Module 10
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: ecr-only
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["cloudsentinel-p-9001"]
      validate:
        message: "Images must come from 229032674007.dkr.ecr.ap-south-1.amazonaws.com/cloudsentinel/ (trusted registry)."
        pattern:
          spec:
            =(initContainers):
              - image: "229032674007.dkr.ecr.ap-south-1.amazonaws.com/cloudsentinel/*"
            =(ephemeralContainers):
              - image: "229032674007.dkr.ecr.ap-south-1.amazonaws.com/cloudsentinel/*"
            containers:
              - image: "229032674007.dkr.ecr.ap-south-1.amazonaws.com/cloudsentinel/*"
