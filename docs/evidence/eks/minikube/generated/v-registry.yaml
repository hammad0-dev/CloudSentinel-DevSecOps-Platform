apiVersion: v1
kind: Pod
metadata:
  name: untrusted-registry-pod
  namespace: cloudsentinel-p-9001
  labels: {app: untrusted-registry-pod, owner: project-9001}
spec:
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: c
      image: docker.io/library/python:3.12.15-slim-bookworm
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      resources: {limits: {cpu: 100m, memory: 64Mi}, requests: {cpu: 10m, memory: 32Mi}}
