# ml-dast LAB: deliberately vulnerable apps for building the DAST training/evaluation data.
# LAB ONLY. Every port is published on 127.0.0.1 only; nothing here may be exposed or deployed.
# The crawler/payload sender refuses any target outside the allowlist in
# services-ml/ml-dast/dastml/guards.py (127.0.0.1 / localhost, ports 5101-5108 by default).
#
# Ground truth: services-ml/ml-dast/data/dast/GROUND_TRUTH.md and ground_truth.json.
# Third-party sources (NodeGoat, vulpy) are copied at pinned commits into lab/vendor/ (gitignored)
# by lab/fetch-vendor.sh.
#
#   cd services-ml/ml-dast/lab && ./fetch-vendor.sh && docker compose up -d --build
name: mldast-lab

x-lab: &lab
  restart: "no"
  networks: [lab]
  security_opt: ["no-new-privileges:true"]

services:
  # ---- apps I own (exact ground truth, vulnerable + safe twins) ----
  labflask:
    <<: *lab
    build: ./labflask
    image: mldast-lab/labflask:1
    ports: ["127.0.0.1:5101:8080"]
    mem_limit: 128m

  labexpress:
    <<: *lab
    build: ./labexpress
    image: mldast-lab/labexpress:1
    environment: { DATABASE_URL: "postgres://lab:lab@labexpress-db:5432/lab" }
    depends_on: [labexpress-db]
    ports: ["127.0.0.1:5102:8080"]
    mem_limit: 128m
  labexpress-db:
    <<: *lab
    image: postgres:15-alpine
    environment: { POSTGRES_USER: lab, POSTGRES_PASSWORD: lab, POSTGRES_DB: lab }
    mem_limit: 192m

  labfastapi:
    <<: *lab
    build: ./labfastapi
    image: mldast-lab/labfastapi:1
    environment: { DB_HOST: labfastapi-db, DB_PASSWORD: lab }
    depends_on: [labfastapi-db]
    ports: ["127.0.0.1:5103:8080"]
    mem_limit: 160m
  labfastapi-db:
    <<: *lab
    image: mysql:5.7
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=32M"]
    environment: { MYSQL_ROOT_PASSWORD: labroot, MYSQL_DATABASE: lab, MYSQL_USER: lab, MYSQL_PASSWORD: lab }
    mem_limit: 320m

  # ---- third-party vulnerable apps ----
  juice-shop:
    <<: *lab
    image: bkimminich/juice-shop:latest   # already local; digest recorded in data/dast/manifest.json
    environment: { NODE_OPTIONS: "--max-old-space-size=768" }   # 512m ran out of JS heap during a ZAP scan
    ports: ["127.0.0.1:5104:3000"]
    mem_limit: 1g

  dvna:                                   # FINAL HELD-OUT APP: never used for training or tuning
    <<: *lab
    image: appsecco/dvna:latest
    environment: { MYSQL_USER: dvna, MYSQL_PASSWORD: passw0rd, MYSQL_DATABASE: dvna, MYSQL_HOST: dvna-db, MYSQL_PORT: "3306" }
    depends_on: [dvna-db]
    ports: ["127.0.0.1:5105:9090"]
    mem_limit: 256m
  dvna-db:
    <<: *lab
    image: mysql:5.7
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=32M"]
    environment: { MYSQL_ROOT_PASSWORD: dvnaroot, MYSQL_DATABASE: dvna, MYSQL_USER: dvna, MYSQL_PASSWORD: passw0rd }
    mem_limit: 320m

  nodegoat:
    <<: *lab
    build: ./vendor/NodeGoat
    image: mldast-lab/nodegoat:c5cb68a
    environment: { MONGODB_URI: "mongodb://nodegoat-db:27017/nodegoat", NODE_ENV: development }
    depends_on: [nodegoat-db]
    command: sh -c "until nc -z nodegoat-db 27017; do sleep 1; done && node artifacts/db-reset.js && npm start"
    ports: ["127.0.0.1:5106:4000"]
    mem_limit: 256m
  nodegoat-db:
    <<: *lab
    image: mongo:4.4
    mem_limit: 256m

  vulpy-bad:
    <<: *lab
    build: { context: ./vendor/vulpy, dockerfile: ../../vulpy.Dockerfile, args: { VARIANT: bad } }
    image: mldast-lab/vulpy-bad:5249cc8
    ports: ["127.0.0.1:5107:5000"]
    mem_limit: 128m
  vulpy-good:
    <<: *lab
    build: { context: ./vendor/vulpy, dockerfile: ../../vulpy.Dockerfile, args: { VARIANT: good } }
    image: mldast-lab/vulpy-good:5249cc8
    ports: ["127.0.0.1:5108:5000"]
    mem_limit: 128m

  # vulnerable-node (cr0hn @ d68f2a3, MIT): v2 third-party training app. Its SSRF mocks (imds, vault)
  # are NOT started; IMDS_URL/VAULT_URL point at a closed local port. /tools/fetch is skip-listed.
  vulnerable-node:
    <<: *lab
    build: ./vendor/vulnerable-node
    image: mldast-lab/vulnerable-node:d68f2a3
    environment:
      DATABASE_URL: postgres://nodebazaar:nodebazaar@vn-db:5432/nodebazaar
      MONGO_URL: mongodb://vn-mongo:27017/nodebazaar
      IMDS_URL: http://127.0.0.1:9
      VAULT_URL: http://127.0.0.1:9
      SESSION_SECRET: lab-only-not-a-secret
      JWT_SECRET: lab-only-not-a-secret
      DEBUG_ERRORS: "1"
      NODE_ENV: development
    depends_on:
      vn-db: { condition: service_healthy }
      vn-mongo: { condition: service_started }
    dns: ["127.0.0.1"]   # no external resolver: the app cannot fetch internet hosts (service names still resolve)
    ports: ["127.0.0.1:5110:3000"]
    mem_limit: 256m
  vn-db:
    <<: *lab
    image: postgres:16-alpine
    environment: { POSTGRES_USER: nodebazaar, POSTGRES_PASSWORD: nodebazaar, POSTGRES_DB: nodebazaar }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nodebazaar -d nodebazaar"], interval: 3s, timeout: 3s, retries: 20 }
    mem_limit: 192m
  vn-mongo:
    <<: *lab
    image: mongo:7
    command: ["--quiet", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 384m

  # v3 third-party TRAINING apps (ground_truth_v3.json). No resolver; dangerous routes are skip-listed.
  vampi:                                  # erev0s/VAmPI @ f16052d (MIT), upstream Dockerfile, vulnerable=1
    <<: *lab
    build: ./vendor/VAmPI
    image: mldast-lab/vampi:f16052d
    environment: { vulnerable: "1", tokentimetolive: "600" }
    dns: ["127.0.0.1"]
    ports: ["127.0.0.1:5111:5000"]
    mem_limit: 256m
  node-api-goat:                          # layro01/node-api-goat @ 868ee6c (ISC)
    <<: *lab
    build: { context: ./vendor/node-api-goat, dockerfile: ../../node-api-goat.Dockerfile }
    image: mldast-lab/node-api-goat:868ee6c
    dns: ["127.0.0.1"]
    ports: ["127.0.0.1:5112:3001"]
    mem_limit: 128m

  # v2 FINAL HELD-OUT APP (frozen in data/dast/FREEZE_v2.json): only started with --profile final-v2,
  # only by scripts/eval_final_v2.py. dns 127.0.0.1 = no resolver, so /?domain (nslookup) cannot
  # query the internet; the guards never send URL-carrying parameters (its /?path, /?include, /?xml
  # would fetch them), and object/include/xml/size are on the parameter skip list.
  dsvw:
    <<: *lab
    build: { context: ./vendor/DSVW, dockerfile: ../../dsvw.Dockerfile }
    image: mldast-lab/dsvw:9ca3c9a
    profiles: ["final-v2"]
    dns: ["127.0.0.1"]
    ports: ["127.0.0.1:5109:8080"]
    mem_limit: 2g   # its own index page links a time-based SQLi exploit (RANDOMBLOB(300000000)); 128m was OOM-killed

  # v3 FINAL HELD-OUT APP (frozen in data/dast/FREEZE_v3.json): SirAppSec vuln-node.js-express.js-app
  # @ b977c74. Labelled from source and frozen before any request; only started with --profile final-v3,
  # only by scripts/eval_final_v3.py. No resolver; /v1/status/{brand} (execSync curl), /v1/test (SSRF)
  # and /v1/init (deserialization) are on the ground-truth skip list and are never requested.
  sirappsec:
    <<: *lab
    build: { context: ./vendor/sirappsec, dockerfile: ../../sirappsec.Dockerfile }
    image: mldast-lab/sirappsec:b977c74
    profiles: ["final-v3"]
    dns: ["127.0.0.1"]
    ports: ["127.0.0.1:5113:5000"]
    mem_limit: 1g

networks:
  lab:
    internal: false   # published ports need a non-internal network; the apps get no outbound use
