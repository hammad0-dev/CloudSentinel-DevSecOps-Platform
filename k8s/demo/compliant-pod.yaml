# Module 10 FE-5 demo: the same workload made compliant; Kyverno admits it.
apiVersion: v1
kind: Pod
metadata:
  name: compliant-pod
  namespace: cloudsentinel-p-demo
  labels:
    app: compliant-pod
    owner: project-demo
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.36.1
      command: ["sh", "-c", "id && sleep 3600"]
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
