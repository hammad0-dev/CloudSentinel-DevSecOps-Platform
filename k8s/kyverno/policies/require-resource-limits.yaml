apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require CPU and memory limits
    policies.kyverno.io/category: CloudSentinel FE-1
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-resource-limits
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["cloudsentinel-p-*"]
      validate:
        message: "CPU and memory limits are required for every container."
        pattern:
          spec:
            =(initContainers):
              - resources:
                  limits:
                    cpu: "?*"
                    memory: "?*"
            containers:
              - resources:
                  limits:
                    cpu: "?*"
                    memory: "?*"
