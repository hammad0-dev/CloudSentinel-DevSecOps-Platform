apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow latest tag
    policies.kyverno.io/category: CloudSentinel FE-1
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["cloudsentinel-p-*"]
      validate:
        message: "An explicit image tag is required."
        pattern:
          spec:
            =(initContainers):
              - image: "*:*"
            containers:
              - image: "*:*"
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["cloudsentinel-p-*"]
      validate:
        message: "Using the mutable image tag 'latest' is not allowed."
        pattern:
          spec:
            =(initContainers):
              - image: "!*:latest"
            containers:
              - image: "!*:latest"
