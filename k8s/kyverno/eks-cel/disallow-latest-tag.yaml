# Module 10 (EKS, Kyverno 1.20): CEL port of the ClusterPolicy with the same name (Kyverno 1.20 no longer runs
# kyverno.io/v1 ClusterPolicy). Same rule, same scope: Pods (and Deployments via autogen) in cloudsentinel-p-*.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow latest tag
    policies.kyverno.io/category: CloudSentinel Module 10
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Deny]
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: project-namespaces-only
      expression: >-
        (has(object.metadata.namespace) && object.metadata.namespace != '' ? object.metadata.namespace : request.namespace).startsWith('cloudsentinel-p-')
  variables:
    - name: containers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
    - name: allContainers
      expression: "variables.containers + object.spec.?ephemeralContainers.orValue([])"
  validations:
    - expression: >-
        variables.allContainers.all(c, c.image.contains('@') || c.image.split('/')[size(c.image.split('/')) - 1].contains(':'))
      message: "An explicit image tag is required."
    - expression: "variables.allContainers.all(c, !c.image.endsWith(':latest'))"
      message: "Using the mutable image tag 'latest' is not allowed."
