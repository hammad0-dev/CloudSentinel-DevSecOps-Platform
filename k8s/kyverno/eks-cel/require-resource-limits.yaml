# Module 10 (EKS, Kyverno 1.20): CEL port of the ClusterPolicy with the same name (Kyverno 1.20 no longer runs
# kyverno.io/v1 ClusterPolicy). Same rule, same scope: Pods (and Deployments via autogen) in cloudsentinel-p-*.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require CPU and memory limits
    policies.kyverno.io/category: CloudSentinel Module 10
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Deny]
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: project-namespaces-only
      expression: >-
        (has(object.metadata.namespace) && object.metadata.namespace != '' ? object.metadata.namespace : request.namespace).startsWith('cloudsentinel-p-')
  variables:
    - name: containers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
    - name: allContainers
      expression: "variables.containers + object.spec.?ephemeralContainers.orValue([])"
  validations:
    - expression: >-
        variables.containers.all(c, ['cpu', 'memory'].all(r, r in c.?resources.?limits.orValue({})))
      message: "CPU and memory limits are required for every container."
