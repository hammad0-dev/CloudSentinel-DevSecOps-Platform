# Module 11 FE-1/FE-4: Promtail DaemonSet shipping three labelled sources to Loki:
#   source=k8s      pod logs from project namespaces (cloudsentinel-p-<id>), with project_id label
#   source=kyverno  Kyverno admission-controller logs (kyverno namespace)
#   source=backend  CloudSentinel backend JSON log file (backend/logs/app.log) via hostPath mount
# helm upgrade --install promtail grafana/promtail -n monitoring -f k8s/monitoring/promtail-values.yaml
resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits: { cpu: 200m, memory: 128Mi }

config:
  clients:
    - url: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push
  snippets:
    # Replaces the chart's default kubernetes-pods job.
    scrapeConfigs: |
      - job_name: kubernetes-pods
        pipeline_stages:
          - cri: {}
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            regex: cloudsentinel-p-\d+|kyverno
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: __host__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - replacement: k8s
            target_label: source
          - source_labels: [__meta_kubernetes_namespace]
            regex: kyverno
            replacement: kyverno
            target_label: source
          - source_labels: [__meta_kubernetes_namespace]
            regex: cloudsentinel-p-(\d+)
            replacement: $1
            target_label: project_id
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            replacement: /var/log/pods/*$1/*.log
            target_label: __path__

      - job_name: cloudsentinel-backend
        static_configs:
          - targets: [localhost]
            labels:
              source: backend
              job: cloudsentinel-backend
              __path__: /var/log/cloudsentinel/app.log
        pipeline_stages:
          - json:
              expressions: { level: level, event: event, ts: ts }
          - labels: { level: "" }
          - timestamp:
              source: ts
              format: RFC3339Nano

# Backend log directory on the node. Point it at the host directory holding app.log
# (run the backend with APP_LOG_FILE=/var/log/cloudsentinel/app.log, or mount backend/logs here).
# If the backend runs off-cluster, set LOKI_PUSH_URL in backend/.env instead and leave this unused.
extraVolumes:
  - name: cloudsentinel-backend-logs
    hostPath:
      path: /var/log/cloudsentinel
      type: DirectoryOrCreate
extraVolumeMounts:
  - name: cloudsentinel-backend-logs
    mountPath: /var/log/cloudsentinel
    readOnly: true
