# Module 9 (EKS): the store every generated ExternalSecret uses. ESO authenticates with its IRSA role
# (cloudsentinel-eso-irsa, limited to cloudsentinel/* and rds!db-* secrets). Only cloudsentinel-p-<n> namespaces
# may use it. LIMITATION: one shared role, so projects are not isolated from each other's secrets at the AWS layer.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cloudsentinel-aws
spec:
  conditions:
    - namespaceRegexes: ["^cloudsentinel-p-[1-9][0-9]*$"]
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
